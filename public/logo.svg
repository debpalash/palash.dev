<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6d8"/>
      <stop offset="0.35" stop-color="#f5c518"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="0.62" stop-color="#ffdf6b"/>
      <stop offset="1" stop-color="#8a5c00"/>
    </linearGradient>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181b4a"/>
      <stop offset="0.55" stop-color="#101233"/>
      <stop offset="1" stop-color="#0a0b24"/>
    </linearGradient>
    <linearGradient id="shinegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <circle cx="3" cy="3" r="1.4" fill="#f5c518" opacity="0.14"/>
    </pattern>
    <path id="pshape" fill-rule="evenodd" d="M96 62 h46 c28 0 45 15 45 38 c0 23 -17 38 -45 38 h-22 v40 h-24 Z M120 84 v32 h20 c13 0 20 -6 20 -16 c0 -10 -7 -16 -20 -16 Z"/>
    <clipPath id="pclip"><use href="#pshape"/></clipPath>
  </defs>

  <style>
    .float { animation: fl 5.5s ease-in-out infinite; transform-origin: 120px 120px; }
    @keyframes fl {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1.2deg); }
    }
    .shine { animation: sw 3.6s ease-in-out infinite; }
    @keyframes sw {
      0%, 55% { transform: translateX(-130px) skewX(-22deg); }
      85%, 100% { transform: translateX(190px) skewX(-22deg); }
    }
    .zap { animation: zap 3.6s ease-in-out infinite; }
    @keyframes zap {
      0%, 78%, 100% { opacity: 0.5; }
      88% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .float, .shine, .zap { animation: none !important; }
    }
  </style>

  <g class="float">
    <g transform="rotate(-8 120 120)">
      <rect x="26" y="26" width="188" height="188" rx="16" fill="url(#cardbg)" stroke="url(#chrome)" stroke-width="7"/>
      <rect x="37" y="37" width="166" height="166" rx="10" fill="none" stroke="#e23636" stroke-width="2.5" opacity="0.85"/>
      <rect x="38" y="38" width="164" height="164" rx="10" fill="url(#dots)"/>

      <!-- speed slashes -->
      <g class="zap">
        <path d="M50 62 L96 50" stroke="#f5c518" stroke-width="5" stroke-linecap="round"/>
        <path d="M50 76 L82 68" stroke="#e23636" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- extruded P: depth stack -->
      <g>
        <use href="#pshape" fill="#3f0c0c" transform="translate(9,9)"/>
        <use href="#pshape" fill="#5c1212" transform="translate(7,7)"/>
        <use href="#pshape" fill="#7a1717" transform="translate(5,5)"/>
        <use href="#pshape" fill="#992020" transform="translate(3,3)"/>
        <use href="#pshape" fill="url(#chrome)" stroke="#3f0c0c" stroke-width="2.5"/>
        <g clip-path="url(#pclip)">
          <rect class="shine" x="40" y="40" width="42" height="150" fill="url(#shinegrad)"/>
        </g>
      </g>

      <!-- wordmark -->
      <g font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-weight="900" font-style="italic" font-size="27" letter-spacing="1.5" text-anchor="middle">
        <text x="123" y="196" fill="#e23636">PALASH</text>
        <text x="120" y="193" fill="#f5c518" stroke="#3f0c0c" stroke-width="0.8">PALASH</text>
      </g>
    </g>
  </g>
</svg>
