<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="0.5" stop-color="#0c0e13"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="sheengrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardclip">
      <rect x="28" y="28" width="184" height="184" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .float { animation: fl 6s ease-in-out infinite; transform-origin: 120px 120px; }
    @keyframes fl {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(0.8deg); }
    }
    .sheen { animation: sw 4.5s ease-in-out infinite; }
    @keyframes sw {
      0%, 55% { transform: translateX(-220px) skewX(-18deg); }
      90%, 100% { transform: translateX(260px) skewX(-18deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .float, .sheen { animation: none !important; }
    }
  </style>

  <g class="float">
    <g transform="rotate(-8 120 120)">
      <rect x="28" y="28" width="184" height="184" rx="10" fill="url(#cardbg)" stroke="#3a3f4a" stroke-width="1.5"/>

      <!-- corner hatching, like the original mark -->
      <g stroke="#d8dae0" stroke-width="1.6" opacity="0.85" stroke-linecap="round">
        <path d="M154 40 l34 34 M166 38 l30 30 M178 38 l24 24"/>
        <path d="M40 158 l36 36 M38 172 l28 28 M38 186 l16 16"/>
      </g>

      <!-- double-stroke P monogram -->
      <g fill="none" stroke="#eceef2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M103 58 V162" stroke-width="5"/>
        <path d="M95 66 V152" stroke-width="2"/>
        <path d="M103 62 h32 c25 0 40 13 40 31 s-15 31 -40 31 h-32" stroke-width="5"/>
        <path d="M111 76 h23 c16 0 27 8 27 17 s-11 17 -27 17 h-23" stroke-width="2"/>
      </g>

      <!-- wordmark -->
      <text x="120" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="7" fill="#eceef2">PALASH</text>

      <g clip-path="url(#cardclip)">
        <rect class="sheen" x="28" y="28" width="70" height="184" fill="url(#sheengrad)"/>
      </g>
    </g>
  </g>
</svg>
